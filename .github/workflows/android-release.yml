name: Android Release

# android/ 코드가 바뀌면 서명된 APK를 빌드해 GitHub Release(v<번호>)로 올린다.
# 앱은 최신 Release를 확인해 앱 안에서 업데이트한다.
# 필요한 저장소 Secrets: KEYSTORE_BASE64 (서명 키 파일을 base64로 인코딩한 값), KEYSTORE_PASSWORD
on:
  push:
    branches: [main, claude/periodic-screen-click-app-rfuhse]
    paths: ['android/**', '.github/workflows/android-release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets are not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          VC=$(( ${{ github.run_number }} + 1 ))
          echo "VC=$VC" >> "$GITHUB_ENV"
          ./gradlew assembleRelease -PversionCode=$VC --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/AutoClicker-v$VC.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VC" "$RUNNER_TEMP/AutoClicker-v$VC.apk" \
            --target "$GITHUB_SHA" \
            --title "v$VC" \
            --notes "$(git log -1 --pretty=%s)"
